    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; height: 100dvh; background: #131722; color: #d1d4dc;

    #app { display: flex; flex-direction: row; height: 100vh; height: 100dvh; }

    /* ── チャートエリア ── */
    #chart-area { flex: 1; min-width: 0; min-height: 0; }
    #plotly-chart { width: 100%; height: 100%; }

    /* ── サイドパネル（デスクトップ：右） ── */
    #side-panel {
      width: 230px; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: #181c28; border-left: 1px solid #2a2e39; overflow: hidden;
    }

    /* ── モバイル：パネルを下に ── */
    @media (max-width: 767px) {
      #app { flex-direction: column; }
      #side-panel {
        width: 100%; height: 175px; flex-shrink: 0;
        border-left: none; border-top: 1px solid #2a2e39;
        flex-direction: column;
      }
      .legend-list  { flex: 1; min-height: 0; max-height: calc(175px - 44px); }
      .nav-buttons  { height: 44px; flex-shrink: 0; }
    }

    /* ── 現在の選択状態ラベル（モバイルでは非表示） ── */
    .state-info {
      padding: 7px 12px; font-size: 12px; color: #aaa;
      background: #131722; border-bottom: 1px solid #2a2e39;
      text-align: center; flex-shrink: 0; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    @media (max-width: 767px) { .state-info { display: none; } }

    /* ── 凡例リスト ── */
    .legend-list {
      flex: 1; overflow-y: auto; padding: 4px 0; min-height: 0;
    }
    .legend-item {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px; cursor: pointer;
      border-radius: 4px; margin: 1px 4px;
      font-size: 11px; color: #999;
      transition: background 0.15s, color 0.15s;
    }
    .legend-item:hover { background: #2a2e39; color: #d1d4dc; }
    .legend-item.active { background: rgba(255,255,255,0.09); color: #fff; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-rank { font-size: 9px; color: #666; flex-shrink: 0; width: 38px; }
    .legend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* モバイル：横スクロール凡例 */
    @media (max-width: 767px) {
      .legend-list {
        display: flex; flex-direction: row;
        overflow-x: auto; overflow-y: hidden;
        padding: 4px 4px; gap: 4px; align-items: stretch; flex: 1;
      }
      .legend-item {
        flex-direction: column; align-items: center; text-align: center;
        padding: 4px 6px; margin: 0; min-width: 58px; flex-shrink: 0;
        font-size: 10px;
      }
      .legend-rank { width: auto; }
    }

    /* ── ↑↓ ナビボタン ── */
    .nav-buttons { display: flex; flex-direction: column; flex-shrink: 0; }
    @media (max-width: 767px) { .nav-buttons { flex-direction: row; } }

    .nav-btn {
      flex: 1; padding: 11px 8px; background: #242836;
      border: none; color: #d1d4dc; cursor: pointer;
      font-size: 13px; font-family: "Segoe UI", sans-serif;
      transition: background 0.15s; letter-spacing: 0.02em;
    }
    .nav-btn:hover { background: #2e3347; color: #fff; }
    .nav-btn.up   { border-bottom: 1px solid #2a2e39; }
    .nav-btn.down { border-top:    1px solid #2a2e39; }
    @media (max-width: 767px) {
      .nav-btn.up   { border-bottom: none; border-right: 1px solid #2a2e39; }
      .nav-btn.down { border-top:    none; border-left:  1px solid #2a2e39; }
    }
  </style>
</head>

<div id="app">
  <div id="chart-area">
    <div id="plotly-chart"></div>
  </div>
  <div id="side-panel">
    <div class="state-info">{{ currentLabel }}</div>
    <div class="legend-list" ref="legendList">
      <div
        v-for="item in allItems"
        :key="item.state"
        class="legend-item"
        :class="{ active: currentState === item.state }"
        @click="selectState(item.state)"
        :title="item.name + '(' + item.code + ')'"
      >
        <span class="legend-dot" :style="{ background: item.color }"></span>
        <span class="legend-rank">{{ item.rankLabel }}</span>
        <span class="legend-name">{{ item.name }}</span>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn up"   @click="go(-1)">{{ upLabel }}</button>
      <button class="nav-btn down" @click="go(1)">{{ downLabel }}</button>
    </div>
  </div>
</div>

const TOP_N  = 10;

const { createApp, ref, computed, nextTick, onMounted } = Vue;

createApp({
  setup() {
    const currentState = ref(-1);

    // ── トレース情報を構築 ─────────────────────────────
    // idx 0: 背景散布  idx 1..TOP_N: トップN  idx TOP_N+1..TOP_N*2: ワーストN
    function makeItems(startIdx, count, rankFn) {
      const items = [];
      for (let i = 0; i < count; i++) {
        const t = FIGURE.data[startIdx + i];
        if (!t) continue;
        const m = (t.name || '').match(/^(.+?)[(（](.+?)[)）]/);
        items.push({
          state:    (startIdx - 1) + i,
          traceIdx: startIdx + i,
          color:    (t.line && t.line.color) || '#ccc',
          name:     m ? m[1].trim() : (t.name || ''),
          code:     m ? m[2] : '',
          rankLabel: rankFn(i),
        });
      }
      return items;
    }

    const topItems   = makeItems(1,        TOP_N, i => `▲${i + 1}位`);
    const worstItems = makeItems(TOP_N + 1, TOP_N, i => `▼ワースト${TOP_N - i}位`);
    const allItems   = [...topItems, ...worstItems];
    const TOTAL      = TOP_N * 2;

    // ── ナビゲーション ────────────────────────────────
    const prevState = computed(() => {
      if (currentState.value <= 0) return -1;
      return currentState.value - 1;
    });
    const nextState = computed(() => {
      if (currentState.value === -1)       return 0;
      if (currentState.value >= TOTAL - 1) return -1;
      return currentState.value + 1;
    });

    function navLabel(s) {
      if (s === -1) return '全表示';
      return allItems[s]?.rankLabel || '';
    }
    const currentLabel = computed(() => {
      if (currentState.value === -1) return '全銘柄表示';
      const it = allItems[currentState.value];
      return it ? `${it.rankLabel}  ${it.name}` : '';
    });
    const upLabel   = computed(() => '↑ ' + navLabel(prevState.value));
    const downLabel = computed(() => '↓ ' + navLabel(nextState.value));

    const MONTH_ANNOTS = [];

    // トレースの元の textfont.color を保存
    const origTextColor = {};
    allItems.forEach(item => {
      const t = FIGURE.data[item.traceIdx];
      origTextColor[item.traceIdx] = (t.textfont && t.textfont.color) || item.color;
    });

    // ── Plotly 表示制御 ───────────────────────────────
    function applyVisibility(state) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly) return;
      const vis = FIGURE.data.map((_, i) =>
        state === -1 ? true : (i === 0 || i === allItems[state].traceIdx)
      );
      Plotly.restyle(div, { visible: vis });
    }

    // 個別表示時：企業名をチャート上部中央にアノテーションで表示
    function applyCompanyLabel(state) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly) return;
      if (state === -1) {
        Plotly.relayout(div, { annotations: MONTH_ANNOTS });
        allItems.forEach(item => {
          Plotly.restyle(div, { 'textfont.color': [origTextColor[item.traceIdx]] }, [item.traceIdx]);
        });
      } else {
        const item = allItems[state];
        allItems.forEach(it => {
          Plotly.restyle(div, { 'textfont.color': ['rgba(0,0,0,0)'] }, [it.traceIdx]);
        });
        const nameAnnot = {
          text: '<b>' + item.rankLabel + '　' + item.name + '</b>(' + item.code + ')',
          xref: 'paper', yref: 'paper',
          x: 0.5, y: 0.99,
          xanchor: 'center', yanchor: 'top',
          showarrow: false,
          font: { size: 15, color: item.color, family: "'Segoe UI', sans-serif" },
          bgcolor: 'rgba(19,23,34,0.82)',
          borderpad: 5, borderwidth: 1,
          bordercolor: item.color,
        };
        Plotly.relayout(div, { annotations: [...MONTH_ANNOTS, nameAnnot] });
      }
    }

    // 個別表示時：背景散布のホバーを無効化して選択企業のみ詳細表示
    function applyHoverMode(state) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly) return;
      Plotly.restyle(div, { hoverinfo: state === -1 ? 'all' : 'skip' }, [0]);
    }

    function selectState(state) {
      currentState.value = state;
      applyVisibility(state);
      applyCompanyLabel(state);
      applyHoverMode(state);
      nextTick(() => {
        const el = document.querySelector('.legend-item.active');
        if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      });
    }

    function go(dir) {
      selectState(dir === -1 ? prevState.value : nextState.value);
    }

    // ── マウント ──────────────────────────────────────
    onMounted(() => {
      const div = document.getElementById('plotly-chart');
      const layout = Object.assign({}, FIGURE.layout, {
        showlegend: false,
        margin: { t: 110, l: 60, r: 30, b: 65 },
      });
      Plotly.newPlot(div, FIGURE.data, layout, { responsive: true });

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); go(1);  }
        if (e.key === 'ArrowUp')   { e.preventDefault(); go(-1); }
        if (e.key === 'Escape')    { e.preventDefault(); selectState(-1); }
      });
    });

    return { currentState, allItems, currentLabel, upLabel, downLabel, selectState, go };
  },
}).mount('#app');
</script>
