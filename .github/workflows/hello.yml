name: Hello World

on:
  push:
    branches: [main]
    paths: [hello.py]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-hello:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Hello World
        run: python hello.py
      - name: Commit and push datetime file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.txt"
          git commit -m "Add datetime file [skip ci]"
          git push
