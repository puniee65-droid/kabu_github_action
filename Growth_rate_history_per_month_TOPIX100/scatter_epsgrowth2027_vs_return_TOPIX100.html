<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOPIX100 — EPS成長率(2027vs2026) × 1ヶ月株価上昇率</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh; background: #131722; color: #d1d4dc;
      font-family: 'Segoe UI', sans-serif; overflow: hidden;
    }

    /* ── アプリ全体: チャート + サイドパネル ── */
    #app { display: flex; flex-direction: row; height: 100dvh; }

    #chart-area { flex: 1; min-width: 0; min-height: 0; }
    #plotly-chart { width: 100%; height: 100%; }

    /* ══ サイドパネル（PC: 右側縦配置） ══ */
    #side-panel {
      width: 195px; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: #181c28; border-left: 1px solid #2a2e39; overflow: hidden;
    }

    /* ── セクションタイトル ── */
    .section-title {
      padding: 8px 12px 4px;
      font-size: 10px; color: #666;
      text-transform: uppercase; letter-spacing: 0.07em;
      flex-shrink: 0;
    }

    /* ── クラスボタンエリア ── */
    .band-section {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
    }
    .band-list {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow-y: auto; padding: 2px 6px; gap: 2px;
    }
    .band-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 9px;
      background: none; border: 1px solid transparent; border-radius: 5px;
      color: #999; cursor: pointer;
      font-size: 11px; font-family: 'Segoe UI', sans-serif; text-align: left;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .band-btn:hover { background: #242836; color: #d1d4dc; }
    .band-btn.active {
      background: rgba(255,255,255,0.09); color: #fff;
      border-color: #3a3f50;
    }
    .band-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .band-count { font-size: 9px; color: #555; margin-left: auto; padding-left: 4px; }
    .band-btn.active .band-count { color: #888; }

    /* ── 区切り線 ── */
    .panel-divider { height: 1px; background: #2a2e39; margin: 6px 8px; flex-shrink: 0; }

    /* ── ズームエリア ── */
    .zoom-section { flex-shrink: 0; padding: 4px 8px 10px; }
    .zoom-buttons { display: flex; flex-direction: row; gap: 5px; }
    .zoom-btn {
      flex: 1; padding: 8px 4px;
      background: #242836; border: 1px solid #2a2e39; border-radius: 5px;
      color: #d1d4dc; cursor: pointer;
      font-size: 16px; font-family: 'Segoe UI', sans-serif;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: #2e3347; color: #fff; }

    /* ── 移動パッド（PC: d-pad 3×3） ── */
    .pan-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px; margin-top: 3px;
    }
    .pan-btn {
      height: 28px; padding: 0;
      background: #242836; border: 1px solid #2a2e39; border-radius: 4px;
      color: #d1d4dc; cursor: pointer; font-size: 15px;
      font-family: 'Segoe UI', sans-serif; transition: background 0.15s;
    }
    .pan-btn:hover { background: #2e3347; color: #fff; }
    .pan-btn.ph { background: transparent; border-color: transparent; pointer-events: none; }

    /* ══ モバイル（≤767px）: パネルを下に ══ */
    @media (max-width: 767px) {
      #app { flex-direction: column; }
      #side-panel {
        width: 100%; height: 160px; flex-shrink: 0;
        flex-direction: row;
        border-left: none; border-top: 1px solid #2a2e39;
        overflow: hidden;
      }

      /* ズーム＋移動を左の固定列へ（order で先頭に） */
      .zoom-section {
        order: -1;
        width: 78px; flex-shrink: 0;
        border-right: 1px solid #2a2e39;
        padding: 5px 4px;
        display: flex; flex-direction: column;
        justify-content: flex-start; align-items: stretch; gap: 4px;
      }
      .zoom-buttons { flex-direction: column; gap: 3px; }
      .zoom-btn { font-size: 13px; padding: 5px 2px; }

      /* 移動パッド: 2×2 コンパクトグリッド */
      .pan-pad { grid-template-columns: repeat(2, 1fr); gap: 3px; margin-top: 0; }
      .pan-btn.ph { display: none; }
      .pan-btn[data-dir="up"]    { order: 1; }
      .pan-btn[data-dir="right"] { order: 2; }
      .pan-btn[data-dir="left"]  { order: 3; }
      .pan-btn[data-dir="down"]  { order: 4; }
      .pan-btn { height: 22px; font-size: 13px; }

      /* クラスボタンを横スクロール */
      .band-section { flex: 1; min-width: 0; flex-direction: row; align-items: center; }
      .band-list {
        flex-direction: row;
        overflow-x: auto; overflow-y: hidden;
        padding: 5px 6px; gap: 5px; align-items: center;
      }
      .band-btn {
        flex-direction: column; align-items: center; text-align: center;
        min-width: 66px; width: auto; padding: 5px 5px; font-size: 10px;
      }
      .band-count { margin-left: 0; }

      /* モバイルではセクションタイトルと区切り線を非表示 */
      .section-title { display: none; }
      .panel-divider  { display: none; }
    }

    /* ── ローディングオーバーレイ ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(19,23,34,0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    .loading-spinner {
      width: 44px; height: 44px;
      border: 3px solid #2a2e39;
      border-top-color: #4D96FF;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #8899bb; letter-spacing: 0.04em; }
    .loading-sub  { font-size: 11px; color: #556; }
  </style>
</head>
<body>
<div id="app">
  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" v-if="isLoading">
    <div class="loading-spinner"></div>
    <div class="loading-text">リアルタイム株価を取得中...</div>
    <div class="loading-sub">{{ loadingProgress }}</div>
  </div>

  <div id="chart-area">
    <div id="plotly-chart"></div>
  </div>

  <div id="side-panel">
    <!-- クラスフィルター（PC: 上部、mobile: 右側） -->
    <div class="band-section">
      <div class="section-title">現在株価クラス</div>
      <div class="band-list">
        <!-- 全表示ボタン -->
        <button
          :class="['band-btn', { active: selectedBand === null }]"
          @click="selectBand(null)"
        >
          <span class="band-dot" style="background:#888"></span>
          全表示
          <span class="band-count">{{ totalCount }}銘柄</span>
        </button>
        <!-- クラスボタン -->
        <button
          v-for="(b, i) in activeBands"
          :key="i"
          :class="['band-btn', { active: selectedBand === i }]"
          @click="selectBand(i)"
        >
          <span class="band-dot" :style="{ background: b.color }"></span>
          {{ b.label }}
          <span class="band-count">{{ b.count }}銘柄</span>
        </button>
      </div>
      <div class="panel-divider"></div>
    </div>

    <!-- ズーム＋移動ボタン（PC: 下部、mobile: 左） -->
    <div class="zoom-section">
      <div class="section-title">ズーム</div>
      <div class="zoom-buttons">
        <button class="zoom-btn" @click="zoom(0.65)" title="ズームイン">＋</button>
        <button class="zoom-btn" @click="zoom(1.54)" title="ズームアウト">－</button>
        <button class="zoom-btn" @click="resetZoom()" title="リセット">⟳</button>
      </div>
      <div class="section-title" style="margin-top:6px">移動</div>
      <div class="pan-pad">
        <button class="pan-btn ph" disabled></button>
        <button class="pan-btn" data-dir="up"    @click="pan(0,1)"   title="上へ">↑</button>
        <button class="pan-btn ph" disabled></button>
        <button class="pan-btn" data-dir="left"  @click="pan(-1,0)"  title="左へ">←</button>
        <button class="pan-btn ph" disabled></button>
        <button class="pan-btn" data-dir="right" @click="pan(1,0)"   title="右へ">→</button>
        <button class="pan-btn ph" disabled></button>
        <button class="pan-btn" data-dir="down"  @click="pan(0,-1)"  title="下へ">↓</button>
        <button class="pan-btn ph" disabled></button>
      </div>
    </div>
  </div>
</div>

:false,"text":"EPS増益・株価下落","x":1803.375,"xref":"x","y":-22.1168,"yref":"y"},{"font":{"color":"#556","size":10},"showarrow":false,"text":"EPS減益・株価下落","x":10.125,"xref":"x","y":-22.1168,"yref":"y"}],"title":{"font":{"size":16,"color":"#d1d4dc"},"text":"TOPIX100 — EPS成長率(2027vs2026) × 1ヶ月株価上昇率\u003cbr\u003e\u003csup\u003e横軸: EPS上昇率（2027アナリスト予想÷2026実績、%）\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e縦軸: 1ヶ月株価上昇率　期間: 2026\u002f04\u002f28 → 2026\u002f05\u002f29\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e色: 現在株価クラス　　点をホバーで詳細表示\u003c\u002fsup\u003e","x":0.01},"font":{"family":"'Segoe UI', sans-serif","color":"#d1d4dc","size":12},"xaxis":{"title":{"text":"EPS成長率 2027vs2026（%）"},"gridcolor":"#242836","linecolor":"#2a2e39","zerolinecolor":"#555","ticksuffix":"%"},"yaxis":{"title":{"text":"1ヶ月株価上昇率 (%)"},"gridcolor":"#242836","linecolor":"#2a2e39","zerolinecolor":"#555","ticksuffix":"%"},"margin":{"t":135,"l":80,"r":20,"b":75},"paper_bgcolor":"#131722","plot_bgcolor":"#1e222d","hovermode":"closest","showlegend":false}};
const BANDS      = [{"traceIdx": 0, "label": "〜3,000円", "color": "#FF6B6B", "count": 36}, {"traceIdx": 1, "label": "3,001〜6,000円", "color": "#FFD93D", "count": 35}, {"traceIdx": 2, "label": "6,001〜9,000円", "color": "#6BCB77", "count": 15}, {"traceIdx": 3, "label": "9,001〜12,000円", "color": "#4D96FF", "count": 3}, {"traceIdx": 4, "label": "12,001円〜", "color": "#C77DFF", "count": 12}];
const BAND_CODES = [["4188", "4543", "3407", "7733", "9202", "6178", "8750", "7267", "7269", "7201", "6326", "2503", "9433", "8306", "6902", "4568", "8308", "8729", "8604", "8113", "5020", "7270", "4689", "8697", "4503", "9432", "8001", "9434", "5401", "2502", "3382", "4507", "4661", "8801", "8267", "9021"], ["6723", "6762", "6971", "6752", "4307", "7182", "4901", "2802", "8725", "6758", "7936", "5108", "8630", "8058", "8316", "8309", "7751", "6501", "9020", "7832", "7203", "1928", "4502", "9101", "6701", "9104", "6702", "8031", "8802", "1925", "9022", "8002", "7011", "8830", "5803"], ["9984", "8053", "8591", "6954", "9735", "4063", "8015", "6503", "2914", "8411", "4452", "4519", "8766", "6301", "7974"], ["6981", "6098", "4578"], ["5802", "8035", "9983", "6861", "6367", "6201", "7309", "7741", "6920", "6273", "6857", "6146"]];  // active_bands と同順のコード配列

const { createApp, ref, computed, onMounted } = Vue;

createApp({
  setup() {
    const selectedBand    = ref(null);
    const isLoading       = ref(true);
    const loadingProgress = ref('');
    const activeBands     = BANDS;
    const totalCount      = activeBands.reduce((s, b) => s + b.count, 0);

    let initXRange = null;
    let initYRange = null;

    // ── クラス切り替え ───────────────────────────────
    function applyBand(bandIdx) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly) return;

      const vis = FIGURE.data.map((_, i) =>
        bandIdx === null
          ? true
          : (activeBands[bandIdx] && activeBands[bandIdx].traceIdx === i)
      );
      Plotly.restyle(div, { visible: vis });
    }

    function selectBand(idx) {
      selectedBand.value = idx;
      applyBand(idx);
    }

    // ── 移動（現在の範囲幅の 20% ずつシフト） ───────────
    function pan(dx, dy) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly || !div.layout) return;
      const xr = (div.layout.xaxis && div.layout.xaxis.range) || initXRange;
      const yr = (div.layout.yaxis && div.layout.yaxis.range) || initYRange;
      if (!xr || !yr) return;
      const xs = (xr[1] - xr[0]) * 0.2 * dx;
      const ys = (yr[1] - yr[0]) * 0.2 * dy;
      Plotly.relayout(div, {
        'xaxis.range': [xr[0] + xs, xr[1] + xs],
        'yaxis.range': [yr[0] + ys, yr[1] + ys],
      });
    }

    // ── ズーム（[0,0] 原点固定でスケール） ──────────────
    function zoom(factor) {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly || !div.layout) return;
      const xr = (div.layout.xaxis && div.layout.xaxis.range) || initXRange;
      const yr = (div.layout.yaxis && div.layout.yaxis.range) || initYRange;
      if (!xr || !yr) return;
      // [0,0] を中心に各端を factor 倍することで原点を固定したまま拡縮
      Plotly.relayout(div, {
        'xaxis.range': [xr[0] * factor, xr[1] * factor],
        'yaxis.range': [yr[0] * factor, yr[1] * factor],
      });
    }

    function resetZoom() {
      const div = document.getElementById('plotly-chart');
      if (!div || !window.Plotly) return;
      if (initXRange && initYRange) {
        Plotly.relayout(div, {
          'xaxis.range': [...initXRange],
          'yaxis.range': [...initYRange],
        });
      } else {
        Plotly.relayout(div, { 'xaxis.autorange': true, 'yaxis.autorange': true });
      }
    }

    // ── リアルタイム株価取得 ─────────────────────────
    async function fetchRealPrices() {
      const allCodes = BAND_CODES.flat();
      loadingProgress.value = `${allCodes.length} 銘柄を照会中...`;
      try {
        const resp = await fetch(
          '/api/prices?codes=' + allCodes.join(','),
          { signal: AbortSignal.timeout(20000) }
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const priceMap = await resp.json();

        const acquired = Object.keys(priceMap).length;
        loadingProgress.value = `${acquired} / ${allCodes.length} 件取得完了`;

        // 各トレースのテキストを実株価で上書き
        const plotDiv = document.getElementById('plotly-chart');
        if (plotDiv && window.Plotly) {
          for (let ti = 0; ti < BAND_CODES.length; ti++) {
            const codes   = BAND_CODES[ti];
            const trace   = plotDiv.data[ti];
            if (!trace || !trace.text) continue;
            const newText = codes.map((code, j) => {
              const p = priceMap[code];
              const name = (trace.text[j] || '').split('<br>')[0];
              return p != null
                ? name + '<br>' + code + '  ' + p.toLocaleString('ja-JP') + '円'
                : trace.text[j];
            });
            Plotly.restyle(plotDiv, { text: [newText] }, [ti]);
          }
        }
      } catch (e) {
        loadingProgress.value = '取得失敗（生成時の価格を使用）';
        console.warn('株価取得エラー:', e.message);
        await new Promise(r => setTimeout(r, 1200));
      } finally {
        isLoading.value = false;
      }
    }

    // ── マウント ─────────────────────────────────────
    onMounted(() => {
      const div = document.getElementById('plotly-chart');
      const layout = Object.assign({}, FIGURE.layout, {
        showlegend: false,
        margin: { t: 135, l: 75, r: 20, b: 65 },
      });
      Plotly.newPlot(div, FIGURE.data, layout, { responsive: true }).then(() => {
        if (div.layout.xaxis && div.layout.xaxis.range) {
          initXRange = [...div.layout.xaxis.range];
        }
        if (div.layout.yaxis && div.layout.yaxis.range) {
          initYRange = [...div.layout.yaxis.range];
        }
        fetchRealPrices();
      });
    });

    return {
      selectedBand, activeBands, totalCount,
      isLoading, loadingProgress,
      selectBand, zoom, resetZoom, pan,
    };
  },
}).mount('#app');
</script>
